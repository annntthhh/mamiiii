<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mamá</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="fade-in">¡Feliz Día, Mamá!</h1>
            <p class="subtitle">Un pequeño detalle para la mejor del mundo</p>
        </header>

        <div class="photo-frame">
            <!-- Reemplaza 'foto.jpg' con la imagen de ustedes -->
            <img src="foto.jpg" alt="Nosotros" id="main-photo">
        </div>

        <div class="message-box">
            <p id="dynamic-text">Gracias por estar siempre, por tu paciencia y por tu amor infinito. ❤️</p>
        </div>

        <button id="magic-btn">Haz clic para una sorpresa</button>

        <div id="canvas-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
